# DYA Studio
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# Watchdog: peripheral logs its own incidents locally, no Studio RPC needed here
CONFIG_ZMK_WATCHDOG=y

# KScan Diagnostics: peripheral answers relayed queries from the central
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# Low priority workqueue: 768-byte default overflows on relayed request
# handling (same cause as central.conf's setting of this value)
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096